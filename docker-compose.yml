services:
  trace-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql+asyncpg://trace:trace@postgres:5432/trace
      ENVIRONMENT: docker
      CORS_ORIGINS: http://localhost:5173
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      HINDSIGHT_BASE_URL: ${HINDSIGHT_BASE_URL:-https://api.hindsight.vectorize.io}
      HINDSIGHT_BANK_ID: ${HINDSIGHT_BANK_ID:-trace-demo}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trace
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U trace -d trace']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ['trace_pg:/var/lib/postgresql/data']
volumes:
  trace_pg:
